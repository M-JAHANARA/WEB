<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <met a charset="UTF-8">
    <meta name="viewport" content="width=dvice-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
   <form action="action.php" method="get">
        <h2> ثبت سفارش</h2>
        <label for="fullname">
             نام و نام خانوداگی
        </label>
        <input type="text" name="fullname" id="fullname" placeholder="محمدامین جهان آراء" required/><br/><br/>
        <label for="phone">
            تلفن همراه
        </label>
        <input type="tel" name="phone" maxlength="11" id="phone" placeholder="09** *** ****" required/><br/><br/>
        <label for="address">
              آدرس  
        </label>
        <textarea name="address" id="address" rows="5" cols="40" required></textarea><br/><br/>
        <fieldset>
            <legend>انتخاب زمان ارسال</legend>
            <input type="radio" name="time" id="time1" value="saturday 11-15"/>
            <label for="time1">شنبه 11 تا 15</label>
            <br/>
            <input type="radio" name="time" id="time2" value="saturday 16-20"/>
            <label for="time2">شنبه 16 تا 20</label>
        </fieldset><br/><br/>
        <label for="payment_method">روش پرداخت</label>
        <select id="payment_method" required>
            <option value="online">درگاه بانکی </option>
            <option value="cash">پرداخت در محل</option>
        </select><br/><br/>

        <input type="checkbox" id="accept"/>
        <label for="accept">من شرایط و ضوابط رو می پذیرم</label>
        <br/><br/>
        <button type="submit">تایید سفارش</button>
        <button type="submit">لغو پرداخت</button>
   </form>
</body>
</html>
